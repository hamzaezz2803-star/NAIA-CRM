version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next-and-react:
        patterns:
          - next
          - react
          - react-dom
      test-tooling:
        patterns:
          - vitest
          - "@testing-library/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
